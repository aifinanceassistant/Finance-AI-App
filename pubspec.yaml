name: financeai_app
description: FinanceAI mobile app for budgets, accounts, and AI money coaching.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  plaid_flutter: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - .env
    - assets/images/landing_atmosphere.png
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#D6ECFA"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#D6ECFA"
    theme_color: "#3b9ae0"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/app_icon.png
